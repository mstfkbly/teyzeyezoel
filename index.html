
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111528">
<meta name="description" content="Tayyibe Teyze'ye sevgi ve tebessüm dolu özel bir sürpriz.">
<title>Tayyibe Teyze | İyi ki Varsın 🌷</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23111528'/%3E%3Ctext x='32' y='46' font-size='43' text-anchor='middle'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">

<style>
:root {
  --bg:#111528;
  --panel:#22263e;
  --gold:#f1d0a0;
  --rose:#f6b6ce;
  --white:#fff8f4;
  --muted:#ccc7d6;
  --border:rgba(241,208,160,.22);
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; }
body {
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--white);
  background:
    radial-gradient(ellipse at 20% 10%,#58395666,transparent 45%),
    radial-gradient(ellipse at 85% 90%,#60452b55,transparent 48%),
    var(--bg);
  overflow:hidden;
}
button { font:inherit; cursor:pointer; }
button:focus-visible { outline:3px solid var(--rose); outline-offset:4px; }
button:disabled { opacity:.5; cursor:not-allowed; }
.hidden { display:none!important; }

#stars {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.star {
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:var(--gold);
  opacity:.3;
  animation:twinkle 3s infinite alternate;
}
@keyframes twinkle {
  to { opacity:.95; transform:scale(1.8); }
}

.app {
  position:relative;
  z-index:1;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:15px max(15px,env(safe-area-inset-right)) max(15px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left));
}

.topbar {
  width:min(100%,680px);
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:7px 2px 12px;
}
.brand {
  color:var(--gold);
  font-size:10px;
  letter-spacing:1.8px;
  font-weight:700;
}
.top-actions { display:flex; gap:7px; }
.icon-btn {
  border:1px solid var(--border);
  color:var(--gold);
  background:#ffffff0c;
  border-radius:50%;
  width:42px;
  height:42px;
  flex-shrink:0;
}
.progress-wrap {
  width:min(100%,680px);
  margin:0 auto;
}
.progress-info {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  margin-bottom:9px;
}
.progress {
  height:5px;
  border-radius:20px;
  overflow:hidden;
  background:#ffffff20;
}
#progressFill {
  height:100%;
  width:14.285%;
  background:linear-gradient(90deg,var(--rose),var(--gold));
  border-radius:20px;
  transition:width .5s ease;
}

.stage-area {
  display:flex;
  flex:1;
  align-items:center;
  justify-content:center;
  min-height:0;
  padding:16px 0;
}
.stage {
  width:min(100%,680px);
  max-height:100%;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#d5b99155 transparent;
  padding:clamp(23px,5vw,42px);
  border-radius:29px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#2b2b48e8,#191e34f4);
  box-shadow:0 25px 80px #0006,inset 0 1px #ffffff17;
  text-align:center;
  animation:enter .55s ease both;
}
@keyframes enter {
  from { opacity:0; transform:translateY(20px) scale(.98); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
.eyebrow {
  font-size:10px;
  font-weight:750;
  color:var(--gold);
  letter-spacing:2.3px;
  text-transform:uppercase;
}
h1,h2,h3 {
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  line-height:1.17;
}
h1 {
  margin:14px 0 8px;
  font-size:clamp(42px,9vw,76px);
  background:linear-gradient(110deg,#d2a76f,#fff0cb,#d9ad73);
  background-size:200% auto;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  animation:gold 5s linear infinite;
}
@keyframes gold { to { background-position:200% center; } }
h2 {
  font-size:clamp(29px,6vw,44px);
  margin:13px 0 17px;
  color:var(--gold);
}
h3 { font-size:27px; color:var(--rose); }
p { line-height:1.78; font-size:15px; color:var(--muted); }
.big-emoji {
  display:block;
  font-size:clamp(75px,16vw,115px);
  margin:20px 0;
  filter:drop-shadow(0 12px 24px #e5a0c066);
  animation:float 3.5s ease-in-out infinite;
}
@keyframes float { 50% { transform:translateY(-12px); } }
.divider {
  width:80px;height:2px;margin:22px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.pink { color:var(--rose); }
.gold { color:var(--gold); }
.quote {
  padding:25px 18px;
  border-radius:22px;
  background:#ffffff0a;
  border:1px solid #ffffff17;
  margin:20px 0;
}
.quote-text {
  color:var(--white);
  font:clamp(22px,5vw,31px)/1.5 Georgia,serif;
}
.number {
  color:var(--rose);
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
}
.description {
  font-size:14px;
  color:var(--muted);
}
.meter {
  width:100%;
  height:22px;
  border:1px solid var(--border);
  background:#ffffff15;
  border-radius:25px;
  overflow:hidden;
  margin:23px 0;
}
.meter-fill {
  height:100%;
  width:0;
  border-radius:25px;
  background:linear-gradient(90deg,var(--rose),var(--gold));
}
.percent {
  color:var(--gold);
  font:64px Georgia,serif;
}
.result-lines {
  color:var(--white);
  font-size:16px;
  line-height:2;
}
.footer-nav {
  width:min(100%,680px);
  margin:0 auto;
  display:flex;
  gap:10px;
  padding-top:9px;
}
.btn {
  border:0;
  min-height:52px;
  border-radius:999px;
  padding:14px 23px;
  color:#29233a;
  font-size:14px;
  font-weight:750;
  background:linear-gradient(115deg,#ffe6b7,#dbaa76);
  box-shadow:0 10px 27px #d4a77333;
  transition:transform .2s;
}
.btn:active { transform:scale(.97); }
.btn-outline {
  background:#ffffff0a;
  color:var(--gold);
  border:1px solid var(--border);
  box-shadow:none;
}
#backBtn { flex:0 0 auto; }
#nextBtn { flex:1; }
#nextBtn:disabled {
  color:#b8afaa;
  box-shadow:none;
  background:#5b5561;
}
.flower-gift {
  font-size:110px;
  border:0;
  background:transparent;
  animation:float 3s infinite;
}
.flower-gift.opened {
  transform:scale(1.2) rotate(10deg);
  animation:none;
}
.final-text { color:#f8eaf0; font-size:16px; }
.signature {
  margin:24px 0 12px;
  font:27px Georgia,serif;
  color:var(--gold);
}
.particle {
  position:fixed;
  z-index:50;
  pointer-events:none;
  top:-45px;
  left:var(--left);
  font-size:25px;
  animation:fall var(--duration) linear forwards;
}
@keyframes fall {
  to {
    transform:translate(var(--drift),110vh) rotate(600deg);
    opacity:0;
  }
}
#toast {
  position:fixed;
  z-index:60;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 19px;
  border-radius:25px;
  border:1px solid var(--border);
  color:var(--gold);
  background:#292b42;
  text-align:center;
  font-size:13px;
  max-width:calc(100% - 30px);
}
@media(max-width:500px) {
  .app { padding:12px 12px max(12px,env(safe-area-inset-bottom)); }
  .stage { border-radius:23px;padding:24px 19px; }
  .stage-area { padding:12px 0; }
  .brand { font-size:9px;letter-spacing:1px; }
  .big-emoji { margin:15px 0; }
  h2 { margin:11px 0; }
  .quote { padding:20px 14px; }
}
@media(max-height:620px) {
  .big-emoji { font-size:65px;margin:10px; }
  h1 { font-size:40px; }
  h2 { font-size:29px; }
  p { line-height:1.5; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div id="stars" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">🌷 TAYYİBE TEYZE • SIGNATURE EDITION</div>
    <div class="top-actions">
      <button id="musicBtn" class="icon-btn" aria-label="Müziği aç" title="Müzik aç/kapat">🔇</button>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="stageLabel">Sürpriz Yolculuğu</span>
      <span id="stageCount">1 / 7</span>
    </div>
    <div class="progress">
      <div id="progressFill"></div>
    </div>
  </div>

  <main class="stage-area">
    <div id="stage" class="stage" aria-live="polite"></div>
  </main>

  <nav class="footer-nav" aria-label="Sürpriz adımları">
    <button id="backBtn" class="btn btn-outline">← Geri</button>
    <button id="nextBtn" class="btn">Sürprizi Aç 🎁</button>
  </nav>
</div>

<div id="toast" class="hidden" role="status"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const facts = [
  {
    emoji:"😄",
    title:"1. Gülümseme Etkisi",
    text:"Tayyibe teyzenin gülümsemesi, bulunduğu ortamın neşe seviyesini anında artırır. Bu etki karşısında bilim insanları hâlâ şaşkın!"
  },
  {
    emoji:"☕",
    title:"2. Kahve Etkisi",
    text:"Onunla iki dakika sohbet etmek, bazen bir fincan kahveden daha iyi gelir. Üstelik şekersiz bile tatlıdır!"
  },
  {
    emoji:"😂",
    title:"3. Şaka Yeteneği",
    text:"En beklenmedik anda yaptığı bir şakayla herkesi güldürebilir. Şaka radarı sürekli çalışmaktadır!"
  },
  {
    emoji:"🌷",
    title:"4. Anlayış Seviyesi",
    text:"Sabrı, anlayışı ve güzel kalbi ölçülmek istendi. Ölçüm cihazı 'Maşallah!' diyerek çalışmayı durdurdu."
  },
  {
    emoji:"❤️",
    title:"5. Kesin Sonuç",
    text:"Bütün araştırmalar tek bir sonucu gösteriyor: Tayyibe teyze, iyi ki varsın! Hem de çok iyi ki!"
  }
];

const messages = [
  "İş yerinin neşe kaynağı tespit edildi: TAYYİBE TEYZE! 😂",
  "Gülüşün bulaşıcı... İyi ki bunun karantinası yok! 🌸",
  "Teyze dedik ama kalbimizde VIP yer verdik! ❤️",
  "Senin olduğun yerde moral bozukluğu fazla mesai yapamaz! 😄",
  "Anlayış bol, şaka bol, güzel kalp zaten sınırsız! 💐",
  "Seninle iki dakika sohbet bazen bir fincan kahveden iyi gelir! ☕",
  "Tayyibe teyzenin yanında surat asmak gönülden yasak! 😂",
  "Bu kadar güler yüzlü olmak için özel eğitim mi aldın teyze? 😎",
  "Senin güzel kalbine kocaman bir maşallah! 🧿",
  "Bir insan hem bu kadar şakacı hem de bu kadar anlayışlı olur mu? Oluyormuş! 🌷",
  "İyi ki varsın teyze! Hep gül ki dünya biraz daha güzelleşsin. 💖",
  "Bu sayfanın en güzel şeyi ne biliyor musun? Onu okuyan sensin! 🌸"
];

const titles = [
  "Gizemli Açılış",
  "Güzel Bir Karşılama",
  "5 Bilimsel Gerçek",
  "Tebessüm Mesajları",
  "Çiçek Sürprizi",
  "Mutluluk Ölçer",
  "Kalpten Gelen Final"
];

const state = {
  stage:0,
  fact:0,
  message:0,
  flowerOpened:false,
  measured:false,
  measuring:false,
  finalCelebrated:false
};

function celebrate(count=35, icons=["🌷","🌸","✨","💖","🎉"]) {
  if(reduced) return;
  for(let i=0;i<Math.min(count,80);i++) {
    const el=document.createElement("span");
    el.className="particle";
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.setProperty("--left",Math.random()*100+"vw");
    el.style.setProperty("--drift",(Math.random()*180-90)+"px");
    el.style.setProperty("--duration",(3+Math.random()*3)+"s");
    el.style.animationDelay=Math.random()*1+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),7500);
  }
}

let toastTimer;
function toast(text) {
  const el=$("toast");
  el.textContent=text;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("hidden"),2600);
}

function render() {
  const stage=$("stage");
  stage.style.animation="none";
  void stage.offsetWidth;
  stage.style.animation="";

  $("stageLabel").textContent=titles[state.stage];
  $("stageCount").textContent=(state.stage+1)+" / 7";
  $("progressFill").style.width=((state.stage+1)/7*100)+"%";

  $("backBtn").disabled=state.stage===0 || state.measuring;

  let html="";
  let nextLabel="Devam Et →";
  let disabled=false;

  if(state.stage===0) {
    html=`
      <div class="eyebrow">✨ Çok Özel Bir Mesaj ✨</div>
      <div class="big-emoji">🎁</div>
      <h2>Bir Dakika Tayyibe Teyze!</h2>
      <p>
        Önemli bir duyurumuz var! 🚨<br>
        İş yerinin güler yüzlü, şakacı,
        anlayışlı ve kocaman kalpli insanına
        özel bir sürpriz hazırlandı.
      </p>
      <div class="quote">
        <div class="quote-text">
          Hazır mısın bakalım teyze? 🤭
        </div>
      </div>
      <p class="pink">Uyarı: Aşırı tebessüm içerebilir!</p>
    `;
    nextLabel="Sürprizi Aç 🎁";
  }

  if(state.stage===1) {
    html=`
      <div class="eyebrow">🌷 Sana Özel Hazırlandı 🌷</div>
      <span class="big-emoji">💐</span>
      <h1>Tayyibe Teyze</h1>
      <h3>İyi ki Varsın!</h3>
      <div class="divider"></div>
      <p>
        Bazı insanlar vardır, bulundukları yeri
        güzelleştirir. Bir gülümsemeleriyle
        neşe, samimiyetleriyle huzur verirler.
      </p>
      <p class="pink">
        İşte sen tam da o güzel insanlardan birisin. ❤️
      </p>
    `;
    nextLabel="Bakalım Neler Var? 👀";
  }

  if(state.stage===2) {
    const fact=facts[state.fact];
    html=`
      <div class="eyebrow">Gülümseten Araştırmalar Merkezi</div>
      <h2>5 Bilimsel Gerçek 🔬</h2>
      <p class="description">
        Tamamen eğlence amaçlı araştırmalarımızın sonuçları!
      </p>
      <div class="quote">
        <span class="big-emoji">${fact.emoji}</span>
        <div class="number">ARAŞTIRMA ${state.fact+1} / 5</div>
        <h3>${fact.title}</h3>
        <p>${fact.text}</p>
      </div>
      <p class="pink">Bilim dünyası bu teyzenin peşinde! 😄</p>
    `;
    nextLabel=state.fact===4?"Mesajlara Geç 💌":"Sıradaki Gerçek →";
  }

  if(state.stage===3) {
    html=`
      <div class="eyebrow">Tayyibe Teyze Özel Mesaj Servisi</div>
      <h2>Biraz Gülümseyelim mi? 😄</h2>
      <p>Her butonda sana özel yeni bir mesaj.</p>
      <div class="quote">
        <div class="number">MESAJ ${state.message+1} / ${messages.length}</div>
        <div class="quote-text" style="margin-top:24px">
          ${messages[state.message]}
        </div>
      </div>
      <p class="pink">
        Bunları okurken gülümsüyorsan görev başarıyla tamamlanıyor! 🌸
      </p>
    `;
    nextLabel=state.message===messages.length-1
      ?"Çiçek Sürprizine Geç 💐"
      :"Sonraki Mesaj 💌";
  }

  if(state.stage===4) {
    html=`
      <div class="eyebrow">Küçük Bir Hediye</div>
      <h2>Bu Çiçekler Sana! 💐</h2>
      <p>
        Gerçek çiçekler solar ama
        güzel insanların kalbimizde bıraktığı
        izler hep yaşar.
      </p>
      <button id="flowerBtn" class="flower-gift ${state.flowerOpened?"opened":""}"
        aria-label="Çiçek sürprizini aç">💐</button>
      ${
        state.flowerOpened
        ? `<div class="quote">
            <h3>Güzel Kalpli Teyzeme 🌷</h3>
            <p>
              Bu çiçekler, güler yüzün,
              güzel şakaların, anlayışın ve
              samimiyetin için küçük bir teşekkür.
            </p>
            <p class="pink">İyi ki seni tanımışım! ❤️</p>
          </div>`
        : `<p class="pink">Çiçeklere dokun, küçük bir sürpriz var! 🌸</p>`
      }
    `;
    disabled=!state.flowerOpened;
    nextLabel="Mutluluk Testine Geç 💖";
  }

  if(state.stage===5) {
    html=`
      <div class="eyebrow">Tayyibe Teyze Özel Test Merkezi</div>
      <h2>Mutluluk Ölçer 📊</h2>
      <p>
        Bakalım güzel kalp ve neşe seviyen
        kaç çıkacak teyze?
      </p>
      <div class="percent" id="percentage">
        ${state.measured?"100%":"0%"}
      </div>
      <div class="meter">
        <div class="meter-fill" id="meterFill"
          style="width:${state.measured?100:0}%"></div>
      </div>
      ${
        state.measured
        ? `<div class="quote">
            <h3>SONUÇ: MÜKEMMEL! 🎉</h3>
            <div class="result-lines">
              %100 Güler Yüz<br>
              %100 Anlayış<br>
              %100 Şaka Yeteneği<br>
              %100 Güzel Kalp
            </div>
            <p class="pink">
              ⚠️ Bu kadar güzel kalplilik cihazın
              kapasitesini aştı. Teknik ekip şaşkın! 😂
            </p>
          </div>`
        : `<button class="btn btn-outline" id="measureBtn"
             style="margin-top:15px">
             Ölçümü Başlat 🔍
           </button>`
      }
    `;
    disabled=!state.measured;
    nextLabel="Son Mesajı Oku ❤️";
  }

  if(state.stage===6) {
    html=`
      <div class="eyebrow">Kalpten Gelen Birkaç Söz</div>
      <span class="big-emoji">❤️</span>
      <h2>İyi ki Varsın,<br>Tayyibe Teyze</h2>
      <div class="divider"></div>

      <p class="final-text">
        Hayatta bazı insanlar vardır.
        Onlarla tanışmak insana kendini
        şanslı hissettirir.
      </p>
      <p class="final-text">
        Sen de benim için böyle birisin.
        Şakalarınla güldüren, anlayışınla
        insana iyi gelen, güler yüzünle
        bulunduğun yeri güzelleştiren
        güzel kalpli bir insansın.
      </p>
      <p class="final-text">
        Sana “teyze” demem sadece bir hitap değil.
        İçinde sevgi, saygı ve samimiyet var.
      </p>
      <p class="final-text">
        Dilerim yüzündeki güzel gülümseme
        hiç eksik olmasın.
        Hayat sana, senin insanlara kattığın
        güzellikleri getirsin.
      </p>

      <div class="signature">İyi ki tanımışım seni. 🌷</div>
      <p class="pink">Hep böyle güzel gül, olur mu teyze? 😊</p>
    `;
    nextLabel=state.finalCelebrated
      ?"Sürprizi Baştan İzle 🔄"
      :"Son Bir Sürpriz 🎉";
  }

  stage.innerHTML=html;
  stage.scrollTop=0;

  $("nextBtn").textContent=nextLabel;
  $("nextBtn").disabled=disabled || state.measuring;

  const flowerBtn=$("flowerBtn");
  if(flowerBtn)flowerBtn.addEventListener("click",openFlower);

  const measureBtn=$("measureBtn");
  if(measureBtn)measureBtn.addEventListener("click",measure);
}

function next() {
  if(state.measuring)return;

  if(state.stage===2 && state.fact<facts.length-1) {
    state.fact++;
    render();
    return;
  }
  if(state.stage===3 && state.message<messages.length-1) {
    state.message++;
    render();
    return;
  }
  if(state.stage===4 && !state.flowerOpened)return;
  if(state.stage===5 && !state.measured)return;

  if(state.stage===6) {
    if(!state.finalCelebrated) {
      state.finalCelebrated=true;
      celebrate(80,["🌷","💖","🌸","✨","🎉","❤️"]);
      toast("İyi ki varsın Tayyibe Teyze! ❤️");
      render();
    } else {
      resetStory();
    }
    return;
  }

  state.stage++;
  render();

  if(state.stage===1)celebrate(40);
  if(state.stage===6)celebrate(35);
}

function back() {
  if(state.measuring)return;

  if(state.stage===2 && state.fact>0) {
    state.fact--;
  } else if(state.stage===3 && state.message>0) {
    state.message--;
  } else if(state.stage>0) {
    state.stage--;
  }
  render();
}

function openFlower() {
  if(!state.flowerOpened) {
    state.flowerOpened=true;
    celebrate(45,["🌷","🌸","💗","🌼","✨"]);
    render();
    toast("Bu çiçekler güzel kalpli teyzemize! 💐");
  }
}

function measure() {
  if(state.measuring || state.measured)return;

  state.measuring=true;
  $("nextBtn").disabled=true;
  $("backBtn").disabled=true;
  $("measureBtn").disabled=true;
  $("measureBtn").textContent="Ölçülüyor...";

  const duration=reduced?0:2100;
  const start=performance.now();

  function frame(now) {
    const ratio=duration===0?1:Math.min((now-start)/duration,1);
    const value=Math.round((1-Math.pow(1-ratio,3))*100);

    $("percentage").textContent=value+"%";
    $("meterFill").style.width=value+"%";

    if(ratio<1)requestAnimationFrame(frame);
    else {
      state.measuring=false;
      state.measured=true;
      render();
      celebrate(55);
      toast("Ölçüm tamamlandı: EŞSİZ! 🎉");
    }
  }
  requestAnimationFrame(frame);
}

function resetStory() {
  state.stage=0;
  state.fact=0;
  state.message=0;
  state.flowerOpened=false;
  state.measured=false;
  state.measuring=false;
  state.finalCelebrated=false;
  render();
}

$("nextBtn").addEventListener("click",next);
$("backBtn").addEventListener("click",back);

// Yıldızlı arka plan
if(!reduced) {
  for(let i=0;i<60;i++) {
    const star=document.createElement("span");
    star.className="star";
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    star.style.animationDelay=Math.random()*4+"s";
    $("stars").appendChild(star);
  }
}

// İsteğe bağlı hafif melodik ses
let audioContext=null;
let musicOn=false;
let timer=null;
let note=0;
const melody=[
  261.63,329.63,392,523.25,
  493.88,392,329.63,293.66,
  261.63,329.63,440,392,
  349.23,329.63,293.66,261.63
];

function playNote(freq) {
  if(!audioContext || audioContext.state!=="running")return;

  const now=audioContext.currentTime;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();

  oscillator.type="sine";
  oscillator.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.045,now+.05);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.9);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now+.95);
}

function startMusic() {
  clearInterval(timer);
  playNote(melody[note++%melody.length]);
  timer=setInterval(()=>{
    playNote(melody[note++%melody.length]);
  },720);
}

$("musicBtn").addEventListener("click",async()=>{
  try {
    if(!musicOn) {
      const AudioClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioClass) {
        toast("Tarayıcı ses özelliğini desteklemiyor.");
        return;
      }
      if(!audioContext || audioContext.state==="closed")
        audioContext=new AudioClass();

      await audioContext.resume();
      musicOn=true;
      $("musicBtn").textContent="🎵";
      $("musicBtn").setAttribute("aria-label","Müziği kapat");
      startMusic();
    } else {
      musicOn=false;
      clearInterval(timer);
      timer=null;
      if(audioContext && audioContext.state==="running")
        await audioContext.suspend();
      $("musicBtn").textContent="🔇";
      $("musicBtn").setAttribute("aria-label","Müziği aç");
    }
  } catch(e) {
    console.warn(e);
    toast("Müzik başlatılamadı.");
  }
});

document.addEventListener("visibilitychange",()=>{
  if(!musicOn || !audioContext)return;
  if(document.hidden) {
    clearInterval(timer);
    timer=null;
    audioContext.suspend();
  } else {
    audioContext.resume().then(()=>{
      if(musicOn)startMusic();
    }).catch(()=>{});
  }
});

render();
</script>
